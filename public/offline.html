<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f4f7fa">
    <title>Offline | Via Valves</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f7fa;
        color: #20372f;
        font: 16px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      main {
        width: min(100%, 360px);
        padding: 28px;
        border-radius: 24px;
        background: #fff;
      }
      h1 { margin: 0 0 8px; font-size: 22px; }
      p { margin: 0; color: #60716a; }
      a { display: inline-block; margin-top: 20px; color: #4b7f2a; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Reconnect to continue using Via Valves, or reopen a page you have already visited.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
